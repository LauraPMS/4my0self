version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: personal_os_db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_insecure_password_only
      POSTGRES_DB: personal_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d personal_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: personal_os_api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://dev_user:dev_insecure_password_only@db:5432/personal_os
      RUST_LOG: info

volumes:
  postgres_data: